server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Legacy /terrain redirect to integrated globe view
    location = /terrain {
        return 301 /?view=globe&terrain=1&focus=terrain;
    }
    location = /terrain/ {
        return 301 /?view=globe&terrain=1&focus=terrain;
    }

    # Hashed static assets (long cache: 1 year, immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 3D models and binary terrain heightfields
    location ~* \.(glb|bin|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # HTML index (no-cache so updates propagate immediately)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # JSON screening data (no-cache for freshness)
    location ~* \.json$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA Fallback for all other routes (/candidates, /evidence, /play, /?view=globe&site=...)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
